LerpTensorFwdOp:
  ref_api: "torch.lerp"
  # Tensor-weight variant: weight is a tensor that broadcasts together
  # with input and end (PyTorch's torch.lerp(input, end, weight: Tensor)
  # overload). Implements the 3-way tensor broadcast variant; the Op
  # layer pre-broadcasts/expands to contiguous 1-D tensors before kernel
  # dispatch.
  family: elementwise
  status: implemented

  torch_compile_fullgraph: true
  variant_of: LerpFwdOp

  signature:
    inputs:
      input: {dtype: "float16 | bfloat16 | float32"}
      end: {dtype: "same_as(input)"}
      weight: {dtype: "same_as(input)"}
    outputs:
      output: {dtype: "same_as(input)"}
    shape_rules:
    - "output.shape == broadcast_shapes(input.shape, end.shape, weight.shape)"

  workloads:
    # Smoke: small same-shape broadcast (1M elements per operand)
    - {input_shape: [1024, 1024], dtypes: [float32, float16, bfloat16], label: "smoke-1m"}
    # Full: GPU manifest elementwise-16M workload (same shape for all 3 inputs)
    - {input_shape: [4096, 4096], dtypes: [float16, bfloat16, float32], label: "elementwise-16m"}
    # Full: mid-size square
    - {input_shape: [8192, 8192], dtypes: [float16, bfloat16], label: "elementwise-64m"}
    # Full: GPU manifest elementwise-256M workload
    - {input_shape: [16384, 16384], dtypes: [float16, bfloat16], label: "elementwise-256m"}

  # GPU manifest used func mode (tileops.perf.formulas.lerp_tensor_fwd_roofline);
  # the NPU project has no tileops.perf module, so the same formula is
  # expressed inline (Op.eval_roofline implements it too — E14):
  #   per output element: 3 flops (sub + mul + add);
  #   3 reads + 1 write at post-broadcast N_total.
  roofline:
    vars:
      N: "product(input.shape)"
    flops: "3 * N"
    bytes: "4 * N * elem_bytes"

  source:
    kernel: tileops/kernels/elementwise/lerp_tensor/lerp_tensor.py
    kernel_map:
      lerp_tensor: LerpTensorFwdKernel
    op: tileops/ops/elementwise/lerp_tensor.py
    test: tests/ops/test_lerp_tensor.py
    bench: benchmarks/ops/bench_lerp_tensor.py
    bench_manifest_driven: true

LerpFwdOp:
  # Scalar-weight variant of torch.lerp: out = input + weight * (end - input),
  # where ``weight`` is a construction-time scalar constant baked into the
  # compiled kernel (a new Op instance is required per distinct weight).  The
  # tensor-weight overload lives in LerpTensorFwdOp (this op is its variant_of
  # parent).  Broadcast: output.shape == broadcast_shapes(input.shape,
  # end.shape); the Op layer pre-broadcasts/expands to contiguous 1-D vectors
  # before kernel dispatch.
  ref_api: "torch.lerp"
  family: elementwise
  status: implemented

  torch_compile_fullgraph: true

  signature:
    inputs:
      input: {dtype: "float16 | bfloat16 | float32"}
      end: {dtype: "same_as(input)"}
    outputs:
      output: {dtype: "same_as(input)"}
    params:
      weight: {type: float, default: 0.5, kw_only: true}
    shape_rules:
      - "output.shape == broadcast_shapes(input.shape, end.shape)"

  workloads:
    # Smoke: same-shape hidden-state prefill (GPU manifest hidden-state-prefill)
    - {input_shape: [2048, 4096], end_shape: [2048, 4096], dtypes: [float32, float16, bfloat16], label: "hidden-state-prefill"}
    # Full: per-channel broadcast over a CNN feature map (GPU manifest cnn-feat-broadcast)
    - {input_shape: [16, 256, 56, 56], end_shape: [256, 1, 1], dtypes: [float32, float16, bfloat16], label: "cnn-feat-broadcast"}
    # Full: same-shape FFN projection (GPU manifest llama-7b-ffn)
    - {input_shape: [1024, 11008], end_shape: [1024, 11008], dtypes: [float32, float16, bfloat16], label: "llama-7b-ffn"}
    # Full: row-broadcast (GPU manifest linear-bias)
    - {input_shape: [1024, 4096], end_shape: [1, 4096], dtypes: [float32, float16, bfloat16], label: "linear-bias"}

  roofline:
    vars:
      # Post-broadcast output element count.
      N: "product(broadcast(input_shape, end_shape))"
    # FLOPs: sub + scalar mul + add = 3 per output element.
    flops: "3 * N"
    # Memory: 2 reads (input, end at the post-broadcast size) + 1 write, plus
    # the broadcast read of the smaller operand -> 4 * N * elem_bytes per the
    # scalar-lerp roofline.
    bytes: "4 * N * elem_bytes"

  source:
    kernel: tileops/kernels/elementwise/lerp_scalar/lerp_scalar.py
    kernel_map:
      lerp_scalar: LerpScalarFwdKernel
    op: tileops/ops/elementwise/lerp_scalar.py
    test: tests/ops/test_lerp_scalar.py
    bench: benchmarks/ops/bench_lerp_scalar.py
    bench_manifest_driven: true

ClampScalarFwdOp:
  # PyTorch's torch.clamp(input, min=None, max=None) with Number (or None)
  # bounds.  The bounds are params here and tensor inputs in ClampTensorFwdOp;
  # two signatures, so two entries.  The kernel computes in fp32 and casts
  # back, so a half input keeps the precision of the comparison.
  ref_api: "torch.clamp"
  family: elementwise
  status: implemented

  torch_compile_fullgraph: true
  signature:
    inputs:
      input: {dtype: "float16 | bfloat16 | float32"}
    outputs:
      output: {dtype: "same_as(input)"}
    params:
      min: {type: "Number | None", default: null, kw_only: true}
      max: {type: "Number | None", default: null, kw_only: true}
    shape_rules:
      - "present(min) or present(max)"

  workloads:
    # Smoke: small flat vector (both bounds)
    - {input_shape: [1048576], min: -0.5, max: 0.5, dtypes: [float32, float16, bfloat16], label: "smoke-1m"}
    # Full: GPU manifest 16M workload (both bounds)
    - {input_shape: [4096, 4096], min: -0.5, max: 0.5, dtypes: [float16, bfloat16, float32], label: "16M"}
    # Full: GPU manifest 256M workload (both bounds)
    - {input_shape: [16384, 16384], min: -0.5, max: 0.5, dtypes: [float16, bfloat16], label: "256M"}
    # Full: single lower bound (the torch.clamp_min form)
    - {input_shape: [4096, 4096], min: -0.5, dtypes: [float16, bfloat16, float32], label: "16M-min-only"}
    # Full: single upper bound (the torch.clamp_max form)
    - {input_shape: [4096, 4096], max: 0.5, dtypes: [float16, bfloat16, float32], label: "16M-max-only"}

  roofline:
    vars:
      N: "product(input_shape)"
    # FLOPs: clamp = compare-and-select.  Per roofline.md §1.3 convention the
    # clamp / min-max family collapses to 1 FLOP per output element regardless
    # of one or two bounds.
    flops: "1 * N"
    bytes: "2 * N * elem_bytes"

  source:
    kernel: tileops/kernels/elementwise/clamp_scalar/clamp_scalar.py
    kernel_map:
      clamp_scalar: ClampScalarFwdKernel
    op: tileops/ops/elementwise/clamp_scalar.py
    test: tests/ops/test_clamp_scalar.py
    bench: benchmarks/ops/bench_clamp_scalar.py
    bench_manifest_driven: true

ClampMinFwdOp:
  # PyTorch's torch.clamp_min(input, min) = torch.clamp(input, min, max=None):
  # the scalar-min-only specialization of ClampScalarFwdOp.  A thin interface
  # that reuses the migrated clamp_scalar kernel package; no new kernel.
  ref_api: "torch.clamp_min"
  family: elementwise
  status: implemented

  torch_compile_fullgraph: true
  signature:
    inputs:
      input: {dtype: "float16 | bfloat16 | float32"}
    outputs:
      output: {dtype: "same_as(input)"}
    params:
      min: {type: "Number", kw_only: true}
    shape_rules:
      - "present(min)"

  workloads:
    # Smoke: small flat vector (single lower bound)
    - {input_shape: [1048576], min: -0.5, dtypes: [float32, float16, bfloat16], label: "smoke-1m"}
    # Full: GPU manifest 16M workload (single lower bound)
    - {input_shape: [4096, 4096], min: -0.5, dtypes: [float16, bfloat16, float32], label: "16M-min-only"}
    # Full: mid-size square
    - {input_shape: [8192, 8192], min: -0.5, dtypes: [float16, bfloat16], label: "64M-min-only"}
    # Full: GPU manifest 256M workload (single lower bound)
    - {input_shape: [16384, 16384], min: -0.5, dtypes: [float16, bfloat16], label: "256M-min-only"}

  roofline:
    vars:
      N: "product(input_shape)"
    # FLOPs: clamp_min = compare-and-select; per roofline.md §1.3 convention
    # the clamp / min-max family collapses to 1 FLOP per output element.
    flops: "1 * N"
    bytes: "2 * N * elem_bytes"

  source:
    kernel: tileops/kernels/elementwise/clamp_scalar/clamp_scalar.py
    kernel_map:
      clamp_min: ClampScalarFwdKernel
    op: tileops/ops/elementwise/clamp_min.py
    test: tests/ops/test_clamp_min.py
    bench: benchmarks/ops/bench_clamp_min.py
    bench_manifest_driven: true

AddFwdOp:
  # torch.add(input, other, *, alpha=1): y = input + alpha * other, with
  # PyTorch broadcasting.  ``alpha`` is baked into the kernel (one
  # specialization per distinct value).  The GPU op's manifest union also
  # lists ints/bool; this NPU port follows the GPU/test float subset.
  ref_api: "torch.add"
  family: elementwise
  status: implemented

  torch_compile_fullgraph: true

  signature:
    inputs:
      input: {dtype: "float16 | bfloat16 | float32"}
      other: {dtype: "same_as(input)"}
    outputs:
      output: {dtype: "same_as(input)"}
    params:
      alpha: {type: "int | float", default: 1, kw_only: true}
    shape_rules:
      - "output.shape == broadcast_shapes(input.shape, other.shape)"
      # An integral input takes only an integral alpha that converts to it
      # (torch.add semantics).
      - "category(alpha) == 'int' or category(alpha) == category(input.dtype)"
      - "representable(alpha, input.dtype)"

  workloads:
    # Smoke: same-shape hidden-state prefill (GPU manifest hidden-state-prefill)
    - {input_shape: [2048, 4096], other_shape: [2048, 4096], dtypes: [float32, float16, bfloat16], label: "hidden-state-prefill"}
    # Full: per-channel broadcast over a CNN feature map (GPU manifest cnn-feat-broadcast)
    - {input_shape: [16, 256, 56, 56], other_shape: [256, 1, 1], dtypes: [float32, float16, bfloat16], label: "cnn-feat-broadcast"}
    # Full: same-shape FFN projection (GPU manifest llama-7b-ffn)
    - {input_shape: [1024, 11008], other_shape: [1024, 11008], dtypes: [float32, float16, bfloat16], label: "llama-7b-ffn"}
    # Full: row-broadcast bias add (GPU manifest linear-bias)
    - {input_shape: [1024, 4096], other_shape: [1, 4096], dtypes: [float32, float16, bfloat16], label: "linear-bias"}

  roofline:
    vars:
      # Post-broadcast output element count.
      N: "product(broadcast(input_shape, other_shape))"
    # FLOPs: alpha == 1 folds the scalar multiply away; otherwise one mul and
    # one add per output element (GPU manifest formula, verbatim).
    flops: "(1 if alpha == 1 else 2) * N"
    # Memory: 2 reads (both operands at the post-broadcast size) + 1 write.
    bytes: "3 * N * elem_bytes"

  source:
    kernel: tileops/kernels/elementwise/add/add.py
    kernel_map:
      add: AddFwdKernel
    op: tileops/ops/elementwise/add.py
    test: tests/ops/test_add.py
    bench: benchmarks/ops/bench_add.py
    bench_manifest_driven: true

SubFwdOp:
  # torch.sub(input, other, *, alpha=1): y = input - alpha * other, with
  # PyTorch broadcasting.  ``alpha`` is baked into the kernel (one
  # specialization per distinct value).  The GPU op's manifest union also
  # lists ints (uint8..int64); this NPU port follows the GPU/test float
  # subset (float16/bf16/fp32 -- the migration targets).
  ref_api: "torch.sub"
  family: elementwise
  status: implemented

  torch_compile_fullgraph: true

  signature:
    inputs:
      input: {dtype: "float16 | bfloat16 | float32"}
      other: {dtype: "same_as(input)"}
    outputs:
      output: {dtype: "same_as(input)"}
    params:
      alpha: {type: "int | float", default: 1, kw_only: true}
    shape_rules:
      - "output.shape == broadcast_shapes(input.shape, other.shape)"
      # An integral input takes only an integral alpha that converts to it
      # (torch.sub semantics).
      - "category(alpha) == 'int' or category(alpha) == category(input.dtype)"
      - "representable(alpha, input.dtype)"

  workloads:
    # Smoke: same-shape hidden-state prefill (GPU manifest hidden-state-prefill)
    - {input_shape: [2048, 4096], other_shape: [2048, 4096], dtypes: [float32, float16, bfloat16], label: "hidden-state-prefill"}
    # Full: per-channel broadcast over a CNN feature map (GPU manifest cnn-feat-broadcast)
    - {input_shape: [16, 256, 56, 56], other_shape: [256, 1, 1], dtypes: [float32, float16, bfloat16], label: "cnn-feat-broadcast"}
    # Full: same-shape FFN projection (GPU manifest llama-7b-ffn)
    - {input_shape: [1024, 11008], other_shape: [1024, 11008], dtypes: [float32, float16, bfloat16], label: "llama-7b-ffn"}
    # Full: row-broadcast bias subtraction (GPU manifest linear-bias)
    - {input_shape: [1024, 4096], other_shape: [1, 4096], dtypes: [float32, float16, bfloat16], label: "linear-bias"}
    # Full: same-shape hidden-state (GPU manifest llama-7b-hidden, f16)
    - {input_shape: [1024, 4096], other_shape: [1024, 4096], dtypes: [float16], label: "llama-7b-hidden"}
    # Full: same-shape FFN projection (GPU manifest phi-2-ffn, f16)
    - {input_shape: [1024, 10240], other_shape: [1024, 10240], dtypes: [float16], label: "phi-2-ffn"}
    # Full: row-broadcast bias subtraction (GPU manifest phi-2-ffn-bias, f16)
    - {input_shape: [1024, 10240], other_shape: [1, 10240], dtypes: [float16], label: "phi-2-ffn-bias"}
    # Full: row-broadcast bias subtraction (GPU manifest llama-7b-ffn-bias, f16)
    - {input_shape: [1024, 11008], other_shape: [1, 11008], dtypes: [float16], label: "llama-7b-ffn-bias"}

  roofline:
    vars:
      # Post-broadcast output element count.
      N: "product(broadcast(input_shape, other_shape))"
    # FLOPs: alpha == 1 folds the scalar multiply away; otherwise one mul and
    # one sub per output element (GPU manifest formula, verbatim).
    flops: "(1 if alpha == 1 else 2) * N"
    # Memory: 2 reads (both operands at the post-broadcast size) + 1 write.
    bytes: "3 * N * elem_bytes"

  source:
    kernel: tileops/kernels/elementwise/sub/sub.py
    kernel_map:
      sub: SubFwdKernel
    op: tileops/ops/elementwise/sub.py
    test: tests/ops/test_sub.py
    bench: benchmarks/ops/bench_sub.py
    bench_manifest_driven: true

BitwiseNotFwdOp:
  # torch.bitwise_not: y = ~x for bool / integer inputs (BITWISE_DTYPES).
  # Exact op (no tolerance); the kernel computes the all-ones complement
  # (bool -> x == 0, uint8 -> xor 255, else -> xor -1).
  ref_api: "torch.bitwise_not"
  family: elementwise
  status: implemented

  torch_compile_fullgraph: true
  signature:
    inputs:
      input: {dtype: "bool | uint8 | int8 | int16 | int32 | int64"}
    outputs:
      output: {dtype: "same_as(input)"}
    shape_rules:
      - "output.shape == input.shape"

  workloads:
    # Smoke: small flat vector over every admitted dtype
    - {input_shape: [1048576], dtypes: [int32, int64, bool, uint8, int8, int16], label: "smoke-1m"}
    # Full: GPU manifest elementwise-16M workload (int32 / int64)
    - {input_shape: [4096, 4096], dtypes: [int32, int64], label: "16m"}
    # Full: GPU manifest elementwise-256M workload (int32)
    - {input_shape: [16384, 16384], dtypes: [int32], label: "256m"}
    # Full: GPU 16M shape over the narrow integer / bool dtypes
    - {input_shape: [4096, 4096], dtypes: [bool, uint8, int8, int16], label: "16m-int-small"}

  roofline:
    vars:
      N: "product(input.shape)"
    # FLOPs: bitwise_not is one elementwise all-ones complement per element.
    flops: "1 * N"
    bytes: "2 * N * elem_bytes"

  source:
    kernel: tileops/kernels/elementwise/bitwise_not/bitwise_not.py
    kernel_map:
      bitwise_not: BitwiseNotFwdKernel
    op: tileops/ops/elementwise/bitwise_not.py
    test: tests/ops/test_bitwise_not.py
    bench: benchmarks/ops/bench_bitwise_not.py
    bench_manifest_driven: true

GeluAndMulFwdOp:
  # Fused gated exact-GELU (flashinfer.activation.gelu_and_mul): the input
  # x = [gate, value] is packed along the last dim, x.shape == (M, 2 * N);
  # the output is y = gelu(gate) * value with the exact erf-based GELU
  # (torch.nn.functional.gelu(..., approximate="none")).  The GPU manifest
  # roofline gives flops = 6 * M * N; the memory term (read x's 2 * M * N
  # elements + write M * N) is 3 * M * N * elem_bytes.
  ref_api: "flashinfer.activation.gelu_and_mul"
  family: elementwise
  status: implemented

  torch_compile_fullgraph: true

  signature:
    inputs:
      x: {dtype: "float16 | bfloat16 | float32", shape: "[M, 2 * N]"}
    outputs:
      output: {dtype: "same_as(x)", shape: "[M, N]"}
    shape_rules:
      - "output.shape == [x.shape[0], x.shape[1] // 2]"

  workloads:
    # Smoke: small gated row (gate | value halves)
    - {M: 16, N: 128, dtypes: [float32, float16, bfloat16], label: "smoke"}
    # Full: Llama-3.1-8B SwiGLU FFN intermediate (GPU manifest llama-8b-ffn-prefill)
    - {M: 2048, N: 14336, dtypes: [float16, bfloat16], label: "llama-8b-ffn-prefill"}
    # Full: decode-time row (GPU manifest llama-8b-ffn-decode)
    - {M: 1, N: 14336, dtypes: [bfloat16], label: "llama-8b-ffn-decode"}
    # Full: Qwen3-8B SwiGLU batch-32
    - {M: 32, N: 12288, dtypes: [float16, bfloat16], label: "qwen3-8b-swiglu-b32"}

  roofline:
    # FLOPs: gelu(gate) = gate * 0.5 * (1 + erf(gate / sqrt(2))) = 5, plus the
    # final mul-by-value = 1 -> 6 per output element; M * N output elements.
    flops: "6 * M * N"
    bytes: "3 * M * N * elem_bytes"

  source:
