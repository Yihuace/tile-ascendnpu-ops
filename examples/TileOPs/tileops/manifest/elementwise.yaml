AlibiFwdOp:
  # ALiBi position-encoding bias: out[h, i, j] = -slope_h * |i - j|, where
  # slope_h = 2^(-8 * (h + 1) / num_heads). No tensor input -- the full
  # (num_heads, seq_len, seq_len) bias is synthesized from the
  # construction-time integer parameters.
  #
  # Generative (zero-input) op: the single-input `workloads_to_params`
  # contract does not apply (it requires exactly one tensor input), so the
  # benchmark uses the custom `_generative_params` parametrization plus the
  # empty `_GenerativeWorkload` (ported from the GPU bench file).
  ref_api: "none"
  family: elementwise
  status: implemented

  signature:
    inputs: {}
    outputs:
      output: {dtype: "float16 | bfloat16 | float32", shape: "[num_heads, seq_len, seq_len]"}
    params:
      seq_len: {type: int}
      num_heads: {type: int}
      dtype: {type: torch.dtype}
    shape_rules:
      - "seq_len > 0"
      - "num_heads > 0"

  workloads:
    # Llama-style attention bias dimensions (ported verbatim from the GPU
    # manifest).  The first entry is the smoke case; the remaining three are
    # full.  No extra shapes are introduced.
    - {seq_len: 2048, num_heads: 32, dtype: float16, dtypes: [float16], label: "llama-prefill-2k-fp16"}
    - {seq_len: 2048, num_heads: 32, dtype: bfloat16, dtypes: [bfloat16], label: "llama-prefill-2k-bf16"}
    - {seq_len: 4096, num_heads: 32, dtype: float16, dtypes: [float16], label: "llama-prefill-4k-fp16"}
    - {seq_len: 4096, num_heads: 32, dtype: bfloat16, dtypes: [bfloat16], label: "llama-prefill-4k-bf16"}

  roofline:
    vars:
      H: "output.shape[0]"
      S: "output.shape[1]"
    # FLOPs: per output element compute |i - j| (sub + abs = 2) and
    # multiply by -slope_h (1) = 3. Slope precomputation is O(H) and
    # negligible vs the H * S * S body.
    flops: "3 * H * S * S"
    # Write-only output (no semantic input tensor read).
    bytes: "H * S * S * elem_bytes"

  source:
    kernel: tileops/kernels/elementwise/alibi/alibi.py
    kernel_map:
      alibi: AlibiFwdKernel
    op: tileops/ops/elementwise/alibi.py
    test: tests/ops/test_alibi.py
    bench: benchmarks/ops/bench_alibi.py
    bench_manifest_driven: true

ClampMaxFwdOp:
  ref_api: "torch.clamp_max"
