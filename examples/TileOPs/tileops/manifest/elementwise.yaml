  family: elementwise
  status: implemented
  torch_compile_fullgraph: true

  signature:
    inputs:
      input: {dtype: "float16 | bfloat16 | float32"}
      max: {dtype: "same_as(input)"}
    outputs:
      output: {dtype: "same_as(input)"}
    shape_rules:
      - "output.shape == broadcast_shapes(input.shape, max.shape)"

  workloads:
    # Smoke: small flat same-shape pair
    - {input_shape: [1024], max_shape: [1024], dtypes: [float32, float16, bfloat16], label: "smoke-1k"}
    # Full: GPU manifest elementwise-16M (same shape for both operands)
    - {input_shape: [4096, 4096], max_shape: [4096, 4096], dtypes: [float16, bfloat16, float32], label: "elementwise-16M"}
    # Full: per-channel broadcast (upper bound shared across spatial dims)
    - {input_shape: [16, 256, 56, 56], max_shape: [256, 1, 1], dtypes: [float16, bfloat16, float32], label: "cnn-feat-broadcast"}
    # Full: row broadcast (broadcast first dim)
    - {input_shape: [4096, 4096], max_shape: [1, 4096], dtypes: [float32, float16, bfloat16], label: "row-broadcast"}

  # GPU manifest used func mode (tileops.perf.formulas.clamp_max_fwd_roofline);
  # the NPU project has no tileops.perf module, so the same device-agnostic
  # formula is expressed inline (ClampMaxFwdOp.eval_roofline implements it too):
  #   flops: one min(input, max) per output element (post-broadcast N);
  #   bytes: read input + read max + write output, all post-broadcast, at
  #          the input element size.
  roofline:
    vars:
      N: "product(output.shape)"
    flops: "N"
    bytes: "3 * N * elem_bytes"

  source:
    kernel: tileops/kernels/elementwise/clamp_max/clamp_max.py
