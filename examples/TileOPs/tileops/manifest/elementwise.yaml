GeluTanhAndMulFwdOp:
  # Fused gated tanh-approximate-GELU
  # (flashinfer.activation.gelu_tanh_and_mul): the input x = [gate, value] is
  # packed along the last dim, x.shape == (M, 2 * N); the output is
  # y = gelu_tanh(gate) * value with the tanh approximation
  # (torch.nn.functional.gelu(..., approximate="tanh")), i.e.
  # gelu_tanh(g) = 0.5 * g * (1 + tanh(sqrt(2/pi) * (g + 0.044715 * g^3))).
  # The GPU manifest roofline gives flops = 10 * M * N; the memory term (read
  # x's 2 * M * N elements + write M * N) is 3 * M * N * elem_bytes.
  ref_api: "flashinfer.activation.gelu_tanh_and_mul"
  family: elementwise
  status: implemented

  torch_compile_fullgraph: true

  signature:
    inputs:
      x: {dtype: "float16 | bfloat16 | float32", shape: "[M, 2 * N]"}
    outputs:
      output: {dtype: "same_as(x)", shape: "[M, N]"}
    shape_rules:
      - "output.shape == [x.shape[0], x.shape[1] // 2]"

  workloads:
    # Smoke: small gated row (gate | value halves)
    - {M: 16, N: 128, dtypes: [float32, float16, bfloat16], label: "smoke"}
    # Full: Llama-3.1-8B SwiGLU FFN intermediate (GPU manifest llama-8b-ffn-prefill)
    - {M: 2048, N: 14336, dtypes: [float16, bfloat16], label: "llama-8b-ffn-prefill"}
    # Full: decode-time row (GPU manifest llama-8b-ffn-decode)
    - {M: 1, N: 14336, dtypes: [bfloat16], label: "llama-8b-ffn-decode"}
    # Full: Qwen3-8B SwiGLU batch-32
    - {M: 32, N: 12288, dtypes: [float16, bfloat16], label: "qwen3-8b-swiglu-b32"}

  roofline:
    # FLOPs: gelu_tanh(g) = 0.5 * g * (1 + tanh(sqrt(2/pi) * (g + 0.044715 * g^3))).
    # cube(2 muls) + mul-coeff(1) + add(1) + mul-sqrt(1) + tanh(1) + add(1)
    # + mul-half(1) + mul-by-gate(1) = 9; final mul-by-value = 1. Total 10
    # per output element; M * N output elements.
    flops: "10 * M * N"
    bytes: "3 * M * N * elem_bytes"

  source:
    kernel: tileops/kernels/elementwise/gelu_tanh_and_mul/gelu_tanh_and_mul.py
    kernel_map:
      gelu_tanh_and_mul: GeluTanhAndMulFwdKernel
    op: tileops/ops/elementwise/gelu_tanh_and_mul.py
    test: tests/ops/test_gelu_tanh_and_mul.py
    bench: benchmarks/ops/bench_gelu_tanh_and_mul.py
    bench_manifest_driven: true

IsnanFwdOp:
  # torch.isnan: y = isnan(x), bool output (a float NaN predicate).  Exact op
  # (no tolerance).  The GPU op's manifest union also lists ints/bool, served by
  # an ``isnan_exact`` false-everywhere fallback; this NPU port follows the
  # float workloads (the standard isnan path only).
  ref_api: "torch.isnan"
  family: elementwise
  status: implemented

  torch_compile_fullgraph: true
  signature:
    inputs:
      input: {dtype: "float16 | bfloat16 | float32"}
    outputs:
      output: {dtype: bool}
    shape_rules:
      - "output.shape == input.shape"

  workloads:
    # Smoke: small flat vector over every admitted float dtype
    - {input_shape: [1048576], dtypes: [float32, float16, bfloat16], label: "smoke-1m"}
    # Full: GPU manifest elementwise-16M workload (all float dtypes)
    - {input_shape: [4096, 4096], dtypes: [float16, bfloat16, float32], label: "16m"}
    # Full: GPU manifest elementwise-256M workload (half dtypes)
    - {input_shape: [16384, 16384], dtypes: [float16, bfloat16], label: "256m"}
    # Full: GPU 16M shape over the half dtypes
    - {input_shape: [4096, 4096], dtypes: [float16, bfloat16], label: "16m-half"}

  roofline:
    vars:
      N: "product(input.shape)"
    # FLOPs: isnan is one elementwise predicate per element.
    flops: "1 * N"
    # Memory: read N float elements + write N bool (one byte) elements.
    bytes: "N * elem_bytes + N"

  source:
    kernel: tileops/kernels/elementwise/isnan/isnan.py
    kernel_map:
      isnan: IsnanFwdKernel
    op: tileops/ops/elementwise/isnan.py
    test: tests/ops/test_isnan.py
    bench: benchmarks/ops/bench_isnan.py
    bench_manifest_driven: true

