    test: tests/ops/test_abs.py
    bench: benchmarks/ops/bench_abs.py
    bench_manifest_driven: true


# ---------------------------------------------------------------------------
# Unary math family, ported from GPU manifest/elementwise_unary_math.yaml.
# All four use flops = N / bytes = 2 * N * elem_bytes (verbatim from GPU).
# Integer dtypes declared by the GPU manifest for ceil/floor were
# short-circuited at the GPU op layer (never entering the kernel); the NPU
# port is float-only for the same reason.
