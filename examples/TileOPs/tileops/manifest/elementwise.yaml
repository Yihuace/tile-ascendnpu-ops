AbsFwdOp:
  # Ported from GPU TileOPs manifest/elementwise_unary_math.yaml (AbsFwdOp).
  # Ref: https://github.com/tile-ai/TileOPs (GPU) -> NPU TileOPs.
  ref_api: torch.abs
  family: elementwise
  status: implemented
  torch_compile_fullgraph: true

  signature:
    inputs:
      input:
        # GPU manifest additionally declares int8/int16/int32/int64/uint8;
        # those were short-circuited at the GPU *op layer* (never entering the
        # kernel).  The NPU port starts float-only, matching the float-only
        # kernel family (MishFwdOp precedent).  Integer coverage is a
        # follow-up, tracked in the per-op design doc.
        dtype: float16 | bfloat16 | float32
    outputs:
      output:
        dtype: same_as(input)
    shape_rules:
      - output.shape == input.shape

  workloads:
    # Smoke: flat 1-D vector, all three float dtypes.
    - {input_shape: [1048576], dtypes: [float32, float16, bfloat16], label: "smoke-1m"}
