ClampFwdOp:
  ref_api: "torch.clamp"
  # Primary entry: PyTorch's torch.clamp(input, min: Tensor, max: Tensor)
  # where min / max are Tensors that broadcast together with input.  The
  # scalar (Number) form and the single-bound min-only / max-only forms are
  # separate variant_of entries (ClampScalarFwdOp / ClampMinFwdOp /
  # ClampMaxFwdOp), not migrated here.
  family: elementwise
  status: implemented

  torch_compile_fullgraph: true
  signature:
    inputs:
      input: {dtype: "float16 | bfloat16 | float32"}
      min: {dtype: "same_as(input)"}
      max: {dtype: "same_as(input)"}
    outputs:
      output: {dtype: "same_as(input)"}
    shape_rules:
      # PyTorch broadcasts input/min/max together for tensor-bound clamp.
      - "output.shape == broadcast_shapes(input.shape, min.shape, max.shape)"

  workloads:
    # Smoke: small same-shape operands (1M elements each)
    - {input_shape: [1024, 1024], min_shape: [1024, 1024], max_shape: [1024, 1024], dtypes: [float32, float16, bfloat16], label: "smoke-1m"}
    # Full: GPU manifest elementwise-16M workload (same shape for all 3 operands)
    - {input_shape: [4096, 4096], min_shape: [4096, 4096], max_shape: [4096, 4096], dtypes: [float16, bfloat16, float32], label: "elementwise-16m"}
    # Full: mid-size square (64M elements)
    - {input_shape: [8192, 8192], min_shape: [8192, 8192], max_shape: [8192, 8192], dtypes: [float16, bfloat16], label: "elementwise-64m"}
    # Full: GPU manifest elementwise-256M workload (256M elements)
    - {input_shape: [16384, 16384], min_shape: [16384, 16384], max_shape: [16384, 16384], dtypes: [float16, bfloat16], label: "elementwise-256m"}

  # GPU manifest used func mode (tileops.perf.formulas.clamp_fwd_roofline) —
  # ``broadcast_shapes`` is not in the inline vars-layer namespace.  The NPU
  # project has no tileops.perf module, so the same formula is expressed
  # inline (Op.eval_roofline implements it too):
  #   per output element: 1 fused compare-and-select (roofline.md §1.3);
  #   3 reads (input, min, max) + 1 write at post-broadcast N_total.
  # (All manifest workloads use equal operand shapes, so product(input.shape)
  # equals the post-broadcast N_total.)
  roofline:
