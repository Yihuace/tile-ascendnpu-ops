AddFwdOp:
  ref_api: torch.add
  family: elementwise
  status: implemented
  torch_compile_fullgraph: true
  signature:
    inputs:
      input:
        dtype: float16 | bfloat16 | float32
      other:
        dtype: same_as(input)
    outputs:
      output:
        dtype: same_as(input)
    params:
      alpha:
        type: int | float
        default: 1
        kw_only: true
    shape_rules:
    - output.shape == broadcast_shapes(input.shape, other.shape)
    - category(alpha) == 'int' or category(alpha) == category(input.dtype)
    - representable(alpha, input.dtype)
  workloads:
  - input_shape:
    - 2048
    - 4096
    other_shape:
    - 2048
    - 4096
    dtypes:
    - float32
    - float16
    - bfloat16
    label: hidden-state-prefill
  - input_shape:
    - 16
    - 256
    - 56
    - 56
    other_shape:
    - 256
    - 1
    - 1
    dtypes:
    - float32
    - float16
    - bfloat16
    label: cnn-feat-broadcast
  - input_shape:
    - 1024
    - 11008
    other_shape:
    - 1024
    - 11008
    dtypes:
    - float32
    - float16
    - bfloat16
    label: llama-7b-ffn
  - input_shape:
    - 1024
    - 4096
    other_shape:
    - 1
    - 4096
    dtypes:
    - float32
    - float16
    - bfloat16
    label: linear-bias
  roofline:
    vars:
      N: product(broadcast(input_shape, other_shape))
      B: product(other_shape)
    flops: (1 if alpha == 1 else 2) * N
    bytes: (2 * N + B) * elem_bytes
  source:
    kernel: tileops/kernels/elementwise/add/add.py
    kernel_map:
      add: AddFwdKernel
    op: tileops/ops/elementwise/add.py
    test: tests/ops/test_add.py
    bench: benchmarks/ops/bench_add.py
    bench_manifest_driven: true
