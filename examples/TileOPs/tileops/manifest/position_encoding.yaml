# position_encoding.yaml -- manifest entries for the 'position_encoding' family
# (NPU benchmark).
#
# Standalone spec; no dependency on the TileOPs repository.
#
# Ported from TileOPs ``tileops/manifest/position_encoding.yaml`` -- the
# RopeNeoxOp entry (the GPT-NeoX style RoPE, ``ROTATION_STYLE="neox"``).  The
# GPU manifest groups all five RoPE variants (neox / non_neox / llama31 / yarn /
# longrope) in one entry family; the NPU project ports one op at a time, so this
# file carries only the ops ported so far (RopeNeoxOp).
# ``signature`` / ``shape_rules`` are copied verbatim from the GPU entry
# (``params`` / ``layout`` / ``base`` preserved); the GPU ``source`` paths are
# remapped to the NPU single-op package layout.
#
# Workloads note: RopeNeoxOp has exactly one tensor input (``x``), so the NPU
# manifest workload contract requires the shape key ``x_shape`` (see
# ``single_input_workload_contract``); the GPU ``seq_len`` / ``head_dim`` /
# ``batch`` / ``num_heads`` keys are folded into ``x_shape`` and the
# variant-specific ``layout`` param is kept.  The first workload is the smoke
# case; the rest are full.

RopeNeoxOp:
  ref_api: "none"
  family: position_encoding
  status: spec-only

  signature:
    inputs:
      x: {dtype: "float16 | bfloat16 | float32", shape: "[seq_len, head_dim] | [batch, seq_len, num_heads, head_dim]"}
    outputs:
      output: {dtype: "same_as(x)", shape: "same_as(x)"}
    params:
      layout: {type: str, default: "1d"}
      base: {type: float, default: 10000.0}
    shape_rules:
      - "layout != '1d' or x.ndim == 2"
      - "layout != '2d' or x.ndim == 4"
      - "x.shape[-1] % 2 == 0"

  workloads:
    # Smoke: small 1-D sequence (fast critical path, dtype dispatch).
    - {x_shape: [256, 64], layout: "1d", dtypes: [float16, bfloat16, float32], label: "neox-1d-256-d64-smoke"}
    # Full: GPU manifest release-facing workloads.
    - {x_shape: [2048, 64], layout: "1d", dtypes: [float16], label: "neox-1d-2k-d64-fp16"}
    - {x_shape: [4096, 128], layout: "1d", dtypes: [bfloat16], label: "neox-1d-4k-d128-bf16"}
    - {x_shape: [2, 2048, 32, 128], layout: "2d", dtypes: [float16], label: "neox-2d-b2-s2k-h32-d128-fp16"}

  # Inlined from the GPU ``tileops.perf.formulas.rope_roofline``:
  #   outer = batch * num_heads if layout == "2d" else 1
  #   x_elems = outer * seq_len * head_dim
  #   cos_sin_elems = seq_len * (head_dim // 2) * 2   (cos + sin, each half-width)
  #   flops = 4 * x_elems
  #   bytes = (2 * x_elems + cos_sin_elems) * elem_bytes
  roofline:
    vars:
      seq_len: "x_shape[0] (1d) / x_shape[1] (2d)"
      head_dim: "x_shape[-1]"
      outer: "x_shape[0] * x_shape[2] (2d) / 1 (1d)"
      elem_bytes: "2 (float16/bf16) / 4 (float32)"
    flops: "4 * outer * seq_len * head_dim"
    bytes: "(2 * outer * seq_len * head_dim + seq_len * (head_dim // 2) * 2) * elem_bytes"

  source:
    kernel: tileops/kernels/position_encoding/rope_neox/rope_neox.py
    kernel_map:
      rope_neox: RopeNeoxKernel
    op: tileops/ops/position_encoding/rope_neox.py
    test: tests/ops/test_rope_neox.py
    bench: benchmarks/ops/bench_rope_neox.py
    bench_manifest_driven: true


RopeLlama31Op:
  ref_api: "none"
  family: position_encoding
  status: spec-only
  variant_of: RopeNeoxOp

  signature:
    inputs:
      x: {dtype: "float16 | bfloat16 | float32", shape: "[seq_len, head_dim] | [batch, seq_len, num_heads, head_dim]"}
    outputs:
      output: {dtype: "same_as(x)", shape: "same_as(x)"}
    params:
      layout: {type: str, default: "1d"}
      base: {type: float, default: 10000.0}
      scale_factor: {type: float, default: 8.0}
      low_freq_factor: {type: float, default: 1.0}
      high_freq_factor: {type: float, default: 4.0}
      original_max_position: {type: int, default: 8192}
    shape_rules:
      - "layout != '1d' or x.ndim == 2"
      - "layout != '2d' or x.ndim == 4"
      - "x.shape[-1] % 2 == 0"

  workloads:
    # Smoke: small 1-D sequence (fast critical path, dtype dispatch).
    - {x_shape: [256, 64], layout: "1d", dtypes: [float16, bfloat16, float32], label: "llama31-1d-256-d64-smoke"}
    # Full: GPU manifest release-facing workloads plus one extra 1-D shape.
    - {x_shape: [8192, 128], layout: "1d", dtypes: [bfloat16], label: "llama31-1d-8k-d128-bf16"}
    - {x_shape: [1, 8192, 32, 128], layout: "2d", dtypes: [float16], label: "llama31-2d-b1-s8k-h32-d128-fp16"}
    - {x_shape: [2048, 128], layout: "1d", dtypes: [float16], label: "llama31-1d-2k-d128-fp16"}

  # Inlined from the GPU ``tileops.perf.formulas.rope_roofline`` (identical to
  # the RopeNeoxOp entry -- the rotation cost depends only on table geometry):
  #   outer = batch * num_heads if layout == "2d" else 1
  #   x_elems = outer * seq_len * head_dim
  #   cos_sin_elems = seq_len * (head_dim // 2) * 2   (cos + sin, each half-width)
  #   flops = 4 * x_elems
  #   bytes = (2 * x_elems + cos_sin_elems) * elem_bytes
  roofline:
    vars:
      seq_len: "x_shape[0] (1d) / x_shape[1] (2d)"
      head_dim: "x_shape[-1]"
      outer: "x_shape[0] * x_shape[2] (2d) / 1 (1d)"
      elem_bytes: "2 (float16/bf16) / 4 (float32)"
    flops: "4 * outer * seq_len * head_dim"
    bytes: "(2 * outer * seq_len * head_dim + seq_len * (head_dim // 2) * 2) * elem_bytes"

  source:
    kernel: tileops/kernels/position_encoding/rope_llama31/rope_llama31.py
    kernel_map:
      rope_llama31: RopeLlama31Kernel
    op: tileops/ops/position_encoding/rope_llama31.py
    test: tests/ops/test_rope_llama31.py
    bench: benchmarks/ops/bench_rope_llama31.py
    bench_manifest_driven: true

