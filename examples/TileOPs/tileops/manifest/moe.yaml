# moe.yaml -- manifest entries for the 'moe' family (NPU benchmark).
#
# 说明：本文件由本 family 的算子结果 PR 增量补充，不要整文件覆盖。

FusedMoeFwdCbFwdOp:
  ref_api: "none"
  family: moe
  status: implemented
  variant_of: FusedMoeFwdOp

  # Composition orchestrator: no TileLang kernel of its own.  Same pipeline as
  # FusedMoeFwdOp (FusedTopKOp routing -> MoEPrepareAndFinalizeNoDPEP ->
  # FusedMoEExpertsNopadPersistent3WGFwdOp), but top-k selection applies a
  # per-expert float32 correction bias (Kimi K2 style: select from
  # sigmoid(score) + correction_bias, weight from the original unbiased
  # sigmoid scores, renormalized).  signature / shape_rules are copied verbatim
  # from the GPU TileOPs entry (tileops/manifest/moe.yaml) -- device-agnostic.
  signature:
    inputs:
      hidden_states: {dtype: "float16 | bfloat16"}
      gating_output: {dtype: "float32"}
      correction_bias: {dtype: "float32"}
      w_gate_up: {dtype: "same_as(hidden_states)"}
      w_down: {dtype: "same_as(hidden_states)"}
    outputs:
      output: {dtype: "same_as(hidden_states)"}
    params:
      num_tokens: {type: int}
      num_experts: {type: int}
      top_k: {type: int}
      hidden_size: {type: int}
      ffn_size: {type: int}
      scoring_func: {type: str, default: sigmoid}
      renormalize: {type: bool, default: false}
      routed_scaling_factor: {type: float, default: 1.0}
      activation: {type: str, default: silu_and_mul, kw_only: true}
    shape_rules:
    - "hidden_states.shape   == (num_tokens, hidden_size)"
    - "gating_output.shape   == (num_tokens, num_experts)"
    - "correction_bias.shape == (num_experts,)"
    - "output.shape          == (num_tokens, hidden_size)"

  workloads:
    # Smoke: smallest 3WG-aligned shape (gate_up_n=2*ffn divisible by block_n
    # 256, hidden_size/ffn_size divisible by block_k 64).  Carries both
    # supported dtypes.  First workload is the smoke case (NPU contract).
  - {num_tokens: 16, num_experts: 4, top_k: 2, hidden_size: 256, ffn_size: 128, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, dtypes: [bfloat16, float16], label: "fused-moe-cb-smoke"}
    # Kimi K2: scoring_func=sigmoid, correction_bias, renormalize=True,
    # routed_scaling_factor=2.827.  GPU manifest ships decode + prefill; the
    # medium workload is added to satisfy the NPU >= 4 workload contract.
  - {num_tokens: 512, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, dtypes: [bfloat16], label: "kimi-k2-decode"}
  - {num_tokens: 2048, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, dtypes: [bfloat16], label: "kimi-k2-medium"}
  - {num_tokens: 4096, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, dtypes: [bfloat16], label: "kimi-k2-prefill"}

  roofline:
    # GPU declared `func: tileops.perf.formulas.fused_moe_fwd_bytes`; the NPU
    # project has no tileops.perf package, so the same formula is inlined here.
    # The Cb variant adds the float32 correction-bias read (`num_experts * 4`).
    flops: "num_tokens * top_k * 6 * ffn_size * hidden_size"
    bytes: "(num_experts * 3 * ffn_size * hidden_size + 2 * num_tokens * hidden_size) * elem_bytes + num_tokens * num_experts * 4 + num_experts * 4"

  source:
    # No dedicated kernel: this op composes already-migrated kernels.  The
    # kernel path points at the primary composed kernel (fused top-k routing);
    # the kernel_map lists every composed kernel (ported verbatim from the GPU
    # entry).
    kernel: tileops/kernels/moe/fused_topk/fused_topk.py
    op: tileops/ops/moe/fused_moe.py
    test: tests/ops/test_moe_fused_moe_cb.py
    bench: benchmarks/ops/bench_moe_fused_moe_cb.py
    bench_manifest_driven: true
    kernel_map:
      fused_topk_kernel: FusedTopKKernel
      permute_nopad_kernel: MoePermuteNopadKernel
      moe_grouped_gemm_kernel: GroupedGemmPersistent3WGKernel
      silu_and_mul: SiluAndMulFwdKernel
      gelu_and_mul: GeluAndMulFwdKernel
      unpermute_kernel: MoeUnpermuteKernel

FusedMoeFwdOp:
  ref_api: "none"
  family: moe
  status: implemented

  # Composition orchestrator: no TileLang kernel of its own.  It wires
  # FusedTopKOp (routing) -> MoEPrepareAndFinalizeNoDPEP (prepare/finalize) ->
  # FusedMoEExpertsNopadPersistent3WGFwdOp (permute + grouped GEMM + unpermute).
  # signature / shape_rules are copied verbatim from the GPU TileOPs entry
  # (tileops/manifest/moe.yaml) -- device-agnostic.
  signature:
    inputs:
      hidden_states: {dtype: "float16 | bfloat16"}
      gating_output: {dtype: "float32"}
      w_gate_up: {dtype: "same_as(hidden_states)"}
      w_down: {dtype: "same_as(hidden_states)"}
    outputs:
      output: {dtype: "same_as(hidden_states)"}
    params:
      num_tokens: {type: int}
      num_experts: {type: int}
      top_k: {type: int}
      hidden_size: {type: int}
      ffn_size: {type: int}
      scoring_func: {type: str, default: softmax}
      renormalize: {type: bool, default: false}
      routed_scaling_factor: {type: float, default: 1.0}
      activation: {type: str, default: silu_and_mul, kw_only: true}
    shape_rules:
    - "hidden_states.shape == (num_tokens, hidden_size)"
    - "gating_output.shape == (num_tokens, num_experts)"
    - "output.shape        == (num_tokens, hidden_size)"

  workloads:
    # Smoke: smallest 3WG-aligned shape (gate_up_n=2*ffn divisible by block_n
    # 256, hidden_size/ffn_size divisible by block_k 64).  Carries both
    # supported dtypes.  First workload is the smoke case (NPU contract).
  - {num_tokens: 16, num_experts: 4, top_k: 2, hidden_size: 256, ffn_size: 128, scoring_func: softmax, renormalize: false, dtypes: [bfloat16, float16], label: "fused-moe-smoke"}
    # Qwen3-235B-A22B: scoring_func=softmax
  - {num_tokens: 512, num_experts: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: softmax, renormalize: false, dtypes: [bfloat16], label: "qwen3-235b-decode"}
  - {num_tokens: 4096, num_experts: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: softmax, renormalize: false, dtypes: [bfloat16], label: "qwen3-235b-prefill"}
    # DeepSeek-V3: scoring_func=sigmoid
  - {num_tokens: 512, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: sigmoid, renormalize: false, dtypes: [bfloat16], label: "deepseek-v3-decode"}
  - {num_tokens: 4096, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: sigmoid, renormalize: false, dtypes: [bfloat16], label: "deepseek-v3-prefill"}

  roofline:
    # GPU declared `func: tileops.perf.formulas.fused_moe_fwd_bytes`; the NPU
    # project has no tileops.perf package, so the same formula is inlined here.
    # Byte traffic mixes float32 gating with op-dtype hidden/weights, so
    # elem_bytes cannot express the whole traffic in one term.
    flops: "num_tokens * top_k * 6 * ffn_size * hidden_size"
    bytes: "(num_experts * 3 * ffn_size * hidden_size + 2 * num_tokens * hidden_size) * elem_bytes + num_tokens * num_experts * 4"

  source:
    # No dedicated kernel: this op composes already-migrated kernels.  The
    # kernel path points at the primary composed kernel (fused top-k routing);
    # the kernel_map lists every composed kernel (ported verbatim from the GPU
    # entry).
    kernel: tileops/kernels/moe/fused_topk/fused_topk.py
    op: tileops/ops/moe/fused_moe.py
    test: tests/ops/test_moe_fused_moe.py
    bench: benchmarks/ops/bench_moe_fused_moe.py
    bench_manifest_driven: true
    kernel_map:
      fused_topk_kernel: FusedTopKKernel
      permute_nopad_kernel: MoePermuteNopadKernel
      moe_grouped_gemm_kernel: GroupedGemmPersistent3WGKernel
      silu_and_mul: SiluAndMulFwdKernel
      gelu_and_mul: GeluAndMulFwdKernel
      unpermute_kernel: MoeUnpermuteKernel

FusedMoEExpertsNopadPersistent3WGFwdOp:
  ref_api: "none"
  family: moe
  status: implemented

  # Composition orchestrator: no TileLang kernel of its own.  It wires
  # MoePermuteNopadFwdOp -> 3WG grouped GEMM (gate_up, optionally fused with
  # the activation) -> 3WG grouped GEMM (down) -> MoeUnpermuteFwdOp.  signature
  # / shape_rules / roofline are copied verbatim from the GPU TileOPs entry
  # (tileops/manifest/moe.yaml) -- device-agnostic.
  signature:
    inputs:
      output:
        dtype: same_as(hidden_states)
        note: pre-allocated output buffer
      hidden_states:
        dtype: float16 | bfloat16
      w_gate_up:
        dtype: same_as(hidden_states)
      w_down:
        dtype: same_as(hidden_states)
      topk_weights:
        dtype: float32
      topk_ids:
        dtype: int32
      expert_map:
        dtype: int32
        note: EP mapping, None for single-GPU
      workspace1:
        dtype: float16 | bfloat16
        note: scratch buffer, may be empty
      workspace2:
        dtype: float16 | bfloat16
        note: scratch buffer, may be empty
    outputs:
      output: {dtype: "same_as(hidden_states)"}
    params:
      num_tokens: {type: int}
      num_experts:
        type: int
      top_k: {type: int}
      hidden_size: {type: int}
      ffn_size: {type: int}
      routed_scaling_factor: {type: float, default: 1.0}
      activation: {type: str, default: silu_and_mul, kw_only: true}
    shape_rules:
    - "hidden_states.shape == (num_tokens, hidden_size)"
    - "w_gate_up.shape     == (num_experts, 2 * ffn_size, hidden_size)"
    - "w_down.shape        == (num_experts, hidden_size, ffn_size)"
    - "topk_weights.shape  == (num_tokens, top_k)"
    - "topk_ids.shape      == (num_tokens, top_k)"
    - "output.shape        == (num_tokens, hidden_size)"

  workloads:
    # Smoke: smallest robust shape (NPU manifest workload contract).  Dims are
    # block-aligned to the 3WG kernel (gate_up_n = 2*ffn divisible by block_n
    # 256, hidden_size/ffn_size divisible by block_k 64).  Carries both
    # supported dtypes.
  - {num_tokens: 16, num_experts: 4, top_k: 2, hidden_size: 256, ffn_size: 128, dtypes: [bfloat16, float16], label: "fused-moe-experts-3wg-smoke"}
    # Qwen3-235B-A22B: H=7168, F=2048, E=128, K=8
  - {num_tokens: 512, num_experts: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [bfloat16], label: "qwen3-235b-decode"}
  - {num_tokens: 4096, num_experts: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [bfloat16], label: "qwen3-235b-prefill"}
    # DeepSeek-V3: H=7168, F=2048, E=256, K=8
  - {num_tokens: 512, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [bfloat16], label: "deepseek-v3-decode"}
  - {num_tokens: 4096, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [bfloat16], label: "deepseek-v3-prefill"}

  roofline:
    flops: "num_tokens * top_k * 6 * ffn_size * hidden_size"
    bytes: "(num_experts * 3 * ffn_size * hidden_size + 2 * num_tokens * hidden_size) * elem_bytes"

  source:
    # No dedicated kernel: this op composes already-migrated kernels.  The
    # kernel path points at the primary composed kernel (gate_up/down 3WG
    # persistent); the kernel_map lists every composed kernel (ported verbatim
    # from the GPU entry).
    kernel: tileops/kernels/moe/grouped_gemm_persistent_3wg/grouped_gemm_persistent_3wg.py
    op: tileops/ops/moe/fused_moe_experts_nopad_persistent_3wg.py
    test: tests/ops/test_fused_moe_experts.py
    bench: benchmarks/ops/bench_fused_moe_experts.py
    bench_manifest_driven: true
    kernel_map:
      permute_nopad_kernel: MoePermuteNopadKernel
      moe_grouped_gemm_kernel: GroupedGemmPersistent3WGKernel
      silu_and_mul: SiluAndMulFwdKernel
      gelu_and_mul: GeluAndMulFwdKernel
      unpermute_kernel: MoeUnpermuteKernel

FusedTopKOp:
  ref_api: "none"
  family: moe
  status: implemented

  # MoE fused top-k routing: applies scoring (softmax or sigmoid) to the router
  # logits and selects the top-k experts per token.  Inferred from the GPU
  # source (tileops/ops/moe/fused_topk.py + tileops/kernels/moe/fused_topk.py),
  # which has no standalone GPU manifest entry -- it is only referenced inside
  # the FusedMoE fusion ops' kernel_map.  signature / shape_rules are taken from
  # the op's validation logic; roofline is derived from the GPU benchmark's
  # calculate_flops / calculate_memory (device-agnostic).
  signature:
    inputs:
      gating_output: {dtype: "float16 | bfloat16 | float32"}
    outputs:
      topk_weights: {dtype: "float32"}
      topk_ids: {dtype: "int32"}
    params:
      # Optional committed dims; the preferred API infers them from
      # gating_output.shape.  They participate in the roofline expression.
      num_tokens: {type: int, default: null}
      num_experts: {type: int, default: null}
      top_k: {type: int}
      scoring_func: {type: str, default: softmax}
      renormalize: {type: bool, default: false}
      with_correction_bias: {type: bool, default: false}
      correction_bias: {type: tensor, default: null, compat_default: null}
    shape_rules:
    - "gating_output.ndim == 2"
    - "topk_weights.shape == (gating_output.shape[0], top_k)"
    - "topk_ids.shape == (gating_output.shape[0], top_k)"
    - "correction_bias.shape == (gating_output.shape[1],) when with_correction_bias"

  workloads:
    # Smoke: small shape carrying both supported dtypes (NPU manifest workload
    # contract; E=128 divisible by the warp size).
  - {gating_output_shape: [32, 128], top_k: 8, scoring_func: softmax, renormalize: false, dtypes: [bfloat16, float16], label: "fused-topk-smoke-softmax"}
    # Full: representative model configurations.
    # Kimi K2: E=384, K=8, sigmoid + renormalize.
  - {gating_output_shape: [4096, 384], top_k: 8, scoring_func: sigmoid, renormalize: true, dtypes: [bfloat16], label: "kimi-k2-prefill"}
    # DeepSeek-V3: E=256, K=8, sigmoid.
  - {gating_output_shape: [4096, 256], top_k: 8, scoring_func: sigmoid, renormalize: false, dtypes: [bfloat16], label: "deepseek-v3-prefill"}
    # Qwen3-235B-A22B: E=128, K=8, softmax.
  - {gating_output_shape: [4096, 128], top_k: 8, scoring_func: softmax, renormalize: false, dtypes: [bfloat16], label: "qwen3-235b-prefill"}

  roofline:
    # Scoring (~2 ops/expert) + K-pass argmax selection per expert.
    flops: "num_tokens * num_experts * 2 * (1 + top_k)"
    # gating_output read [T, E] + topk_weights write [T, K] + topk_ids write [T, K]
    bytes: "num_tokens * num_experts * elem_bytes + 2 * num_tokens * top_k * 4"

  source:
    kernel: tileops/kernels/moe/fused_topk/fused_topk.py
    kernel_map:
      fused_topk_kernel: FusedTopKKernel
    op: tileops/ops/moe/fused_topk.py
    test: tests/ops/test_moe_fused_topk.py
    bench: benchmarks/ops/bench_moe_fused_topk.py
    bench_manifest_driven: true

MoePermuteNopadFwdOp:
  ref_api: "none"
  family: moe
  status: implemented

  signature:
    inputs:
      hidden_states: {dtype: "float16 | bfloat16"}
      topk_ids: {dtype: "int32"}
    outputs:
      perm_h: {dtype: "same_as(hidden_states)"}
      true_offsets: {dtype: "int32"}
      true_sizes: {dtype: "int32"}
      expert_first_token_offset: {dtype: "int64"}
      fwd_idx: {dtype: "int32"}
    params:
      num_experts: {type: int, compat_default: null}
    shape_rules:
    - "hidden_states.ndim == 2"
    - "topk_ids.ndim == 2"
    - "topk_ids.shape[0] == hidden_states.shape[0]"
    - "perm_h.shape == (hidden_states.shape[0] * topk_ids.shape[1], hidden_states.shape[1])"
    - "true_offsets.shape == (num_experts,)"
    - "true_sizes.shape == (num_experts,)"
    - "expert_first_token_offset.shape == (num_experts + 1,)"
    - "fwd_idx.shape == (hidden_states.shape[0] * topk_ids.shape[1],)"

  workloads:
    # Smoke: single-token decode shape (Kimi K2: H=7168, E=384, K=8).  Carries
    # both supported dtypes so the benchmark dtype branch is exercised.
  - {hidden_states_shape: [1, 7168], topk_ids_shape: [1, 8], num_experts: 384, dtypes: [bfloat16, float16], label: "moe-permute-nopad-smoke"}
    # Full: representative prefill shapes across model families.
  - {hidden_states_shape: [4096, 7168], topk_ids_shape: [4096, 8], num_experts: 384, dtypes: [bfloat16], label: "kimi-k2-prefill"}
  - {hidden_states_shape: [4096, 7168], topk_ids_shape: [4096, 8], num_experts: 256, dtypes: [bfloat16], label: "deepseek-v3-prefill"}
  - {hidden_states_shape: [4096, 3072], topk_ids_shape: [4096, 8], num_experts: 128, dtypes: [bfloat16], label: "qwen3-30b-prefill"}

  roofline:
    vars:
      T: "hidden_states_shape[0]"
      K: "topk_ids_shape[1]"
      H: "hidden_states_shape[1]"
    # Permute is memory-bound; flops = 0
    flops: "0"
    # hidden_states read [T, H] + perm_h write [T*K, H] + metadata
    bytes: "(T * H + T * K * H) * elem_bytes + (num_experts + 1) * 8 + 2 * T * K * 4 + num_experts * 8"

  source:
    kernel: tileops/kernels/moe/moe_permute_nopad/moe_permute_nopad.py
    kernel_map:
      permute_nopad_kernel: MoePermuteNopadKernel
    op: tileops/ops/moe/moe_permute_nopad.py
    test: tests/ops/test_moe_permute_nopad.py
    bench: benchmarks/ops/bench_moe_permute_nopad.py
    bench_manifest_driven: true

MoeUnpermuteFwdOp:
  ref_api: "none"
  family: moe
  status: implemented

  signature:
    inputs:
      mm2_pad: {dtype: "float16 | bfloat16"}
      fwd_idx: {dtype: "int32"}
      topk_weights: {dtype: "float32"}
    outputs:
      output: {dtype: "same_as(mm2_pad)"}
    params:
      total_tokens: {type: int}
      top_k: {type: int}
      hidden_size: {type: int}
      # Optional caller-provided output buffer (forward(out=...)); when omitted
      # the op allocates. default: null marks it non-required so workloads need
      # not specify it; declared so forward()'s out param matches the spec.
      out: {type: tensor, default: null}
    shape_rules:
    - "output.shape == (total_tokens, hidden_size)"

  workloads:
    # Smoke: small hidden size (NPU manifest workload contract).  Carries both
    # supported dtypes so the benchmark dtype branch is exercised.
  - {total_tokens: 1, top_k: 8, hidden_size: 512, dtypes: [bfloat16, float16], label: "moe-unpermute-smoke"}
    # Full: representative shapes.  Kimi K2 / DeepSeek-V3 / Qwen3-235B-A22B:
    # H=7168, K=8.
  - {total_tokens: 4096, top_k: 8, hidden_size: 7168, dtypes: [bfloat16], label: "large-hidden-prefill"}
  - {total_tokens: 512, top_k: 8, hidden_size: 7168, dtypes: [bfloat16], label: "large-hidden-medium"}
    # Qwen3-30B-A3B: H=3072, K=8
  - {total_tokens: 4096, top_k: 8, hidden_size: 3072, dtypes: [bfloat16], label: "small-hidden-prefill"}

  roofline:
    # multiply + add per element per expert slot: 2 * T*K * H
    flops: "2 * total_tokens * top_k * hidden_size"
    # mm2_pad read [T*K, H] + output write [T, H] + fwd_idx read [T*K]*4 + topk_weights read [T*K]*4
    bytes: "(total_tokens * top_k * hidden_size + total_tokens * hidden_size) * elem_bytes + total_tokens * top_k * 4 + total_tokens * top_k * 4"

  source:
    kernel: tileops/kernels/moe/moe_unpermute/moe_unpermute.py
    kernel_map:
      unpermute_kernel: MoeUnpermuteKernel
    op: tileops/ops/moe/moe_unpermute.py
    test: tests/ops/test_moe_unpermute.py
    bench: benchmarks/ops/bench_moe_unpermute.py
    bench_manifest_driven: true

MoeGroupedGemmNopad3WGFusedActFwdOp:
  ref_api: "none"
  family: moe
  status: implemented

  # Fused gate/up activation grouped GEMM (no-pad, warp-specialized 3WG
  # persistent).  No standalone GPU manifest entry -- it is referenced only by
  # the routed-expert fusion ops (FusedMoEExpertsNopadPersistent3WGFwdOp).
  # signature / shape_rules are inferred from the op constructor + forward
  # contract (tileops/ops/moe/routed_expert/moe_grouped_gemm_nopad_fused_act.py)
  # and the kernel body; roofline is derived from the fused gate/up GEMM work
  # (device-agnostic).
  signature:
    inputs:
      a: {dtype: "float16 | bfloat16"}
      b: {dtype: "same_as(a)"}
      true_sizes: {dtype: "int32"}
      true_offsets: {dtype: "int32"}
    outputs:
      c: {dtype: "same_as(a)"}
    params:
      numel: {type: int}
      num_experts: {type: int}
      ffn: {type: int}
      k: {type: int}
      activation: {type: str, default: silu_and_mul}
    shape_rules:
    - "a.shape == (numel, k)"
    - "b.shape == (num_experts, 2 * ffn, k)"
    - "true_sizes.shape == (num_experts,)"
    - "true_offsets.shape == (num_experts,)"
    - "c.shape == (numel, ffn)"

  workloads:
    # Smoke: smallest robust shape with block-aligned K and ffn
    # (NPU manifest workload contract).
  - {numel: 64, num_experts: 4, ffn: 128, k: 64, activation: silu_and_mul, dtypes: [float16, bfloat16], label: "moe-grouped-gemm-nopad-3wg-fused-act-smoke"}
    # Full: DeepSeek-V3 MoE (E=256, H=7168); ffn=2048 (2*ffn=4096 gate||up).
  - {numel: 4096, num_experts: 256, ffn: 2048, k: 7168, activation: silu_and_mul, dtypes: [bfloat16], label: "deepseek-v3-decode-gate-up"}
